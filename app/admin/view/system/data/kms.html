{extend name="common/layout"/}
{block name="head"} {include file="system/head" /}{/block}
{block name="main"}
<style>
    th,td {
        white-space: nowrap;
    }
    .d-none {
        display: none !important;
    }
</style>

<div class="wrapper wrapper-content animated fadeInUp">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{$webTitle}</h5>
                </div>
                <div class="ibox-content">
                    <p class="text-muted">一张兑换码可同时设置会员时长和账号总数。所有平台共用一个账号上限，例如 2 个哔哩哔哩 + 5 个网易云，或 7 个网易云，账号总数都是 7 个。</p>
                    <div class="form-inline" style="margin-bottom: 15px;">
                        <div class="form-group">
                            <input type="text" class="form-control input-sm" id="search-km" placeholder="兑换码">
                        </div>
                        <div class="form-group">
                            <select class="form-control input-sm" id="search-type">
                                <option selected="" value="">兑换码类型</option>
                                <option value="bundle">统一兑换码</option>
                                <option value="vip">旧版会员码</option>
                                <option value="quota">旧版配额码</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select class="form-control input-sm" id="search-status">
                                <option selected="" value="">兑换码状态</option>
                                <option value="0">未使用</option>
                                <option value="1">已使用</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm" onclick="table_search();">
                            <i class="fa fa-search"></i> 查询
                        </button>
                        <button type="button" class="btn btn-success btn-sm" onclick="ajax_add_km();">
                            <i class="fa fa-plus"></i> 生成兑换码
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" onclick="ajax_del_usedkm();">
                            <i class="fa fa-times"></i> 清除已使用兑换码
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" onclick="ajax_del_notUsedkm();">
                            <i class="fa fa-times"></i> 清除未使用兑换码
                        </button>
                    </div>

                    <table class="table table-bordered table-striped js-dataTable-responsive" id="kmsList">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<template id="redemption-form-template">
    <form id="redemption-form" onsubmit="return false;">
        <div class="form-group">
            <label class="control-label" for="km-preset">快捷套餐</label>
            <select class="form-control" id="km-preset">
                <option value="">自定义</option>
                {volist name="redemption_presets" id="preset"}
                <option value="{$key}" data-days="{$preset.vip_days}" data-accounts="{$preset.account_limit}">{$preset.name} · {if $preset.vip_days == 0}永久会员{else /}{$preset.vip_days} 天{/if} / {if $preset.account_limit == 0}账号不限{else /}{$preset.account_limit} 个账号{/if}</option>
                {/volist}
            </select>
            <p class="help-block">选择套餐使用对应权益；选择“自定义”可填写会员天数和账号总数。</p>
        </div>
        <div class="row d-none" id="km-custom-fields">
            <div class="col-sm-6">
                <label class="control-label" for="km-vip-days">会员时长（天）</label>
                <input class="form-control" type="number" id="km-vip-days" name="vip_days" min="0" max="{$redemption_max_days}" step="1" value="30" required>
                <p class="help-block">0 表示永久会员。</p>
            </div>
            <div class="col-sm-6">
                <label class="control-label" for="km-account-limit">账号总数（个）</label>
                <input class="form-control" type="number" id="km-account-limit" name="account_limit" min="0" max="{$redemption_max_accounts}" step="1" value="7" required>
                <p class="help-block">所有平台合计，0 表示数量不限。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="km-count">生成数量（张）</label>
            <input class="form-control" type="number" id="km-count" name="num" min="1" max="{$redemption_max_batch}" step="1" value="1" required>
        </div>
        <div class="alert alert-info" id="km-summary" role="status" aria-live="polite"></div>
        <p class="text-muted"><small>两项都填 0 即为永久会员、账号数量不限。有限天数在会员未到期时续期，已到期时从当天开始；已有永久会员和无限账号权益会保留。账号总数不叠加，也不降低已有更高上限，名额长期有效。</small></p>
    </form>
</template>
{/block}
{block name="foot"}

<script src="/static/js/plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
<script src="/static/js/plugins/datatables-responsive-bs3/js/responsive.bootstrap.min.js"></script>

<script src="/static/js/admin_kmsList_datatables.js?v={:app_version()}"></script>
{/block}
