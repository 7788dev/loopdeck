{extend name="common/layout"/}
{block name="head"} {include file="system/head" /}{/block}
{block name="main"}
<div class="wrapper wrapper-content animated fadeInUp">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>网站信息配置</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal" onsubmit="return false;" id="info-form">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站名称</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="webname" name="webname"
                                       placeholder="输入你的网站名称"
                                       type="text" value="{:config('web.webname')}">
                                <small class="text-muted">网站名称建议4-6个文字，太长会造成前台显示问题</small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站标题</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="title" name="title"
                                       placeholder="输入你的网站标题"
                                       type="text" value="{:config('web.title')}">
                                <small class="text-muted">此项为搜索SEO优化作用，说明 <a class="lan dl" href="http://www.chinaz.com/web/2014/0513/351260.shtml" target="_blank">点击查看</a>，系统会自动在标题前加入 （您的网站名称 _ ）前缀信息</small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站关键字</label>
                            <div class="col-sm-8">
                                <textarea class="form-control" id="keywords" name="keywords" placeholder="输入你的网站关键字" rows="4">{:config('web.keywords')}</textarea>
                                <small class="text-muted">此项为搜索SEO优化作用，说明 <a class="lan dl" href="http://www.chinaz.com/web/2014/0106/334280.shtml" target="_blank">点击查看</a></small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站描述</label>
                            <div class="col-sm-8">
                                <textarea class="form-control" id="description" name="description" placeholder="输入你的网站描述" rows="4">{:config('web.description')}</textarea>
                                <small class="text-muted">此项为搜索SEO优化作用，说明 <a class="lan dl" href="http://www.chinaz.com/web/2014/0106/334280.shtml" target="_blank">点击查看</a></small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站域名</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="domain" name="domain"
                                       placeholder="输入你的网站域名"
                                       type="text" value="{:config('web.domain')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">网站备用域名</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="domain2" name="domain2"
                                       placeholder="输入你的网站备用域名"
                                       type="text" value="{:config('web.domain2')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">站长QQ</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="user_qq" name="user_qq"
                                       placeholder="输入站长QQ"
                                       type="text" value="{:config('web.user_qq')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">备案号</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="icp" name="icp"
                                       placeholder="输入备案号"
                                       type="text" value="{:config('web.icp')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">首页背景图片地址</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="index_bg" name="index_bg"
                                       placeholder="输入首页背景图片地址"
                                       type="text" value="{:config('web.index_bg')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="index_mode">首页显示模式</label>
                            <div class="col-sm-8">
                                <select class="form-control" id="index_mode" name="index_mode" onchange="selChange(this)">
                                    <option value="1">默认显示首页</option>
                                    <option value="2"{if config('web.index_mode') == 2}selected{/if}>直接跳转登录页面</option>
                                    <option value="3"{if config('web.index_mode') == 3}selected{/if}>显示其他指定网址</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group" id="index-url" style="display: none">
                            <label class="col-sm-3 control-label">首页网址，带http(s)</label>
                            <div class="col-sm-8">
                                <input class="form-control" id="index_url" name="index_url"
                                       placeholder="输入首页网址"
                                       type="text" value="{:config('web.index_url')}">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-3 col-sm-8">
                                <button type="submit" class="btn btn-primary" onclick="ajax_edit_info();">
                                    <i class="fa fa-save"></i> 保存
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="foot"}
<script>
    function ajax_edit_info() {
        x.ajax('/admin/ajax/set/info', $('#info-form').serialize(), function (data) {
            if (data.code == 1) {
                x.notify(data.message, 'success');
            } else {
                x.notify(data.message, 'warning');
            }
        })
    }

    function selChange(_this)
    {
        if ($(_this).prop("value") == 3) {
            $('#index-url').show();
        } else {
            $('#index-url').hide();
        }
    }

    {if config('web.index_mode') == 3}
        $('#index-url').show();
    {/if}
</script>
{/block}
