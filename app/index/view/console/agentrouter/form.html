<form data-agentrouter-form="save" autocomplete="off">
    <div class="form-group">
        <label for="agentrouter-name">备注名</label>
        <input id="agentrouter-name" name="nickname" class="form-control" maxlength="80" value="{$agentrouter_form.nickname|default=''}" placeholder="例如：日常使用、备用账号">
        <p class="help-block">用于区分账号，留空时使用站点名称或用户名。</p>
    </div>
    <div class="form-group">
        <label for="agentrouter-user">用户名</label>
        <input id="agentrouter-user" name="username" class="form-control" maxlength="128" required value="{$agentrouter_form.user_id|default=''}" {if condition="!empty($agentrouter_form.user_id)"}readonly{/if} placeholder="AgentRouter 登录用户名或邮箱">
    </div>
    <div class="form-group">
        <label for="agentrouter-password">密码</label>
        <input id="agentrouter-password" type="password" name="password" class="form-control" maxlength="2048" autocomplete="new-password" {if condition="empty($agentrouter_form.user_id)"}required{/if} placeholder="{if condition='!empty($agentrouter_form.password_configured)'}留空保留已保存的密码{else /}AgentRouter 登录密码{/if}">
        <p class="help-block">系统通过服务器直连登录完成签到，密码仅用于登录，不会回显。</p>
    </div>
    <button class="btn btn-primary" type="submit" data-busy-text="正在验证并保存…">{if condition="empty($agentrouter_form.user_id)"}验证并添加{else /}验证并保存{/if}</button>
</form>
