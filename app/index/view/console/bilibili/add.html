{extend name="common/layout"/}
{block name="head"} {include file="console/head" /}{/block}
{block name="main"}
<style>
    #qr-img {
        min-height: 145px;
        cursor: pointer;
    }
    #qr-img:focus-visible {
        outline: 2px solid var(--bs-primary);
        outline-offset: 2px;
    }
    .bili-code-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: .5rem;
    }
    @media (max-width: 399.98px) {
        .bili-code-row {
            grid-template-columns: minmax(0, 1fr);
        }
        .bili-code-row .btn {
            width: 100%;
        }
    }
</style>
<div class="row gy-3">
    <div class="col-md-6">
        <div class="block block-rounded h-100 mb-0">
            <div class="block-header block-header-default">
                <h3 class="block-title">短信登录</h3>
            </div>
            <div class="block-content">
                <form onsubmit="return false;" id="sms-login-form">
                    <div class="mb-4">
                        <label class="form-label" for="login-phone">手机号</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-mobile-alt"></i></span>
                            <input type="tel" inputmode="numeric" autocomplete="tel" class="form-control" id="login-phone" placeholder="请输入手机号">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="login-code">短信验证码</label>
                        <div class="bili-code-row">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-shield-alt"></i></span>
                                <input type="text" inputmode="numeric" autocomplete="one-time-code" class="form-control" id="login-code" placeholder="请输入验证码">
                            </div>
                            <button type="button" class="btn btn-alt-secondary" id="send-sms">获取验证码</button>
                        </div>
                    </div>
                    <input type="hidden" id="captcha-key">
                    <div class="mb-4">
                        <button type="submit" class="btn btn-alt-primary" id="sms-login">
                            <i class="fa fa-sign-in-alt opacity-50 me-1"></i> 登录
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="block block-rounded h-100 mb-0">
            <div class="block-header block-header-default">
                <h3 class="block-title">扫码添加</h3>
                <div class="block-options">
                    <button type="button" class="btn btn-sm btn-outline-primary" id="qr-verify">扫码完成，点击验证</button>
                </div>
            </div>
            <div class="block-content text-center">
                <div class="alert alert-primary d-flex align-items-center" role="alert">
                    <i class="si si-magic-wand me-2"></i>
                    <p class="mb-0" id="qr-alert">点击图片即可获取二维码</p>
                </div>
                <div class="block" id="qr-img" key="" role="button" tabindex="0" aria-label="点击获取哔哩哔哩登录二维码">
                    <p class="mt-4">
                        <i class="si si-camera fa-4x text-muted"></i>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="foot"}
<script>
    (function () {
        var qrKey = '';
        var qrLoadPending = false;
        var qrVerifyPending = false;
        var smsCaptchaToken = '';
        var countdownTimer = null;

        function setQrStatus(message) {
            $('#qr-alert').text(message);
        }

        function resetQr(message) {
            qrKey = '';
            qrLoadPending = false;
            qrVerifyPending = false;
            $('#qr-img').attr('key', '').html('<p class="mt-4"><i class="si si-camera fa-4x text-muted"></i></p>');
            setQrStatus(message);
        }

        function loadQr() {
            if (qrLoadPending) return;
            qrLoadPending = true;
            qrKey = '';
            $('#qr-img').attr('key', '').html('<p class="mt-4"><i class="fa fa-spinner fa-spin fa-4x text-muted"></i></p>');
            setQrStatus('正在获取二维码');
            x.ajax('/index/ajax/bilibili/getQrimg', null, function (data) {
                qrLoadPending = false;
                if (data.code !== 1 || !data.data || !data.data.qrcode_key) {
                    $('#qr-img').html('<p class="mt-4"><i class="fa fa-exclamation-circle fa-4x text-danger"></i></p>');
                    setQrStatus(data.message || '二维码获取失败，点击图片重试');
                    return;
                }
                qrKey = data.data.qrcode_key;
                $('#qr-img').attr('key', qrKey).html('<img alt="哔哩哔哩登录二维码" src="data:image/png;base64,' + data.data.qrimg + '" height="145px;">');
                setQrStatus('请使用哔哩哔哩 APP 扫码，完成后点击验证');
            }, function () {
                resetQr('二维码获取失败，点击图片重试');
            });
            Codebase.block('state_normal', '#qr-img');
        }

        function verifyQr() {
            qrKey = $('#qr-img').attr('key') || qrKey;
            if (!qrKey) return x.notify('请先获取二维码');
            if (qrVerifyPending) return;
            qrVerifyPending = true;
            x.ajax('/index/ajax/bilibili/qrLogin', {qrcode_key: qrKey}, function (data) {
                qrVerifyPending = false;
                if (data.code === 1) {
                    qrKey = '';
                    $('#qr-img').attr('key', '');
                    setQrStatus('登录成功');
                    x.notify(data.message, 'success');
                    setTimeout(function () {
                        window.location.href = '{:url("/index/console/bilibili/list")}';
                    }, 700);
                    return;
                }
                if (data.code === -2) {
                    setQrStatus('已扫码，请在哔哩哔哩 APP 中确认后再次点击验证');
                    x.notify(data.message, 'warning');
                    return;
                }
                if (data.code === -1) {
                    setQrStatus(data.message || '等待扫码');
                    x.notify(data.message || '请先扫码', 'warning');
                    return;
                }
                if (data.code === 800 || data.code === 86038) {
                    qrKey = '';
                    $('#qr-img').attr('key', '').html('<p class="mt-4"><i class="si si-camera fa-4x text-muted"></i></p>');
                    setQrStatus('二维码已过期，点击图片重新获取');
                    return;
                }
                setQrStatus(data.message || '登录状态查询失败');
                x.notify(data.message || '登录状态查询失败', 'warning');
            }, function () {
                qrVerifyPending = false;
                setQrStatus('登录状态查询失败，请再次点击验证');
            });
        }

        function validPhone() {
            var phone = $.trim($('#login-phone').val());
            if (!/^\d{5,20}$/.test(phone)) {
                x.notify('请输入正确的手机号', 'warning');
                return '';
            }
            return phone;
        }

        function beginCountdown() {
            var remaining = 60;
            var button = $('#send-sms');
            button.prop('disabled', true).text('重新发送（' + remaining + '）');
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(function () {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    button.prop('disabled', false).text('获取验证码');
                    return;
                }
                button.text('重新发送（' + remaining + '）');
            }, 1000);
        }

        function submitSmsCaptcha(phone, result) {
            x.ajax('/index/ajax/bilibili/sendSms', {
                phone: phone,
                token: smsCaptchaToken,
                challenge: result.geetest_challenge,
                validate: result.geetest_validate,
                seccode: result.geetest_seccode
            }, function (data) {
                if (data.code === 1 && data.data && data.data.captcha_key) {
                    $('#captcha-key').val(data.data.captcha_key);
                    beginCountdown();
                    x.notify(data.message, 'success');
                    return;
                }
                x.notify(data.message || '短信验证码发送失败', 'warning');
            });
        }

        function requestSmsCaptcha() {
            var phone = validPhone();
            if (!phone) return;
            x.ajax('/index/ajax/bilibili/geetest_captcha?t=' + Date.now(), null, function (data) {
                var geetest = data.data && data.data.geetest ? data.data.geetest : null;
                if (data.code !== 1 || !geetest || !geetest.gt || !geetest.challenge || !data.data.token) {
                    x.notify(data.message || '人机验证参数获取失败', 'warning');
                    return;
                }
                smsCaptchaToken = data.data.token;
                initGeetest({
                    gt: geetest.gt,
                    challenge: geetest.challenge,
                    offline: false,
                    new_captcha: true,
                    product: 'bind',
                    width: 'auto',
                    https: true
                }, function (captcha) {
                    captcha.onReady(function () {
                        captcha.verify();
                    }).onSuccess(function () {
                        var result = captcha.getValidate();
                        if (result) submitSmsCaptcha(phone, result);
                    }).onError(function () {
                        x.notify('人机验证加载失败', 'warning');
                    });
                });
            });
        }

        function smsLogin() {
            var phone = validPhone();
            if (!phone) return;
            var code = $.trim($('#login-code').val());
            var captchaKey = $('#captcha-key').val();
            if (!/^\d{4,8}$/.test(code)) {
                x.notify('请输入正确的短信验证码', 'warning');
                return;
            }
            if (!captchaKey) {
                x.notify('请先获取短信验证码', 'warning');
                return;
            }
            x.ajax('/index/ajax/bilibili/smsLogin', {
                phone: phone,
                code: code,
                captcha_key: captchaKey
            }, function (data) {
                if (data.code === 1) {
                    x.notify(data.message, 'success');
                    setTimeout(function () {
                        window.location.href = '{:url("/index/console/bilibili/list")}';
                    }, 700);
                    return;
                }
                x.notify(data.message || '短信登录失败', 'warning');
            });
        }

        $('#qr-img').on('click', loadQr).on('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                loadQr();
            }
        });
        $('#qr-verify').on('click', verifyQr);
        $('#send-sms').on('click', requestSmsCaptcha);
        $('#sms-login').on('click', smsLogin);
        $(window).on('beforeunload', function () {
            if (countdownTimer) clearInterval(countdownTimer);
        });
    })();
</script>
{/block}
