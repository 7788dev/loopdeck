<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>{:config('web.webname')} - {:config('web.title')}</title>
    <meta content="{:config('web.keywords')}" name="keywords">
    <meta content="{:config('web.description')}" name="description">
    <link href="/favicon.ico?v={:app_version()}" rel="shortcut icon">
    <link rel="stylesheet" href="/static/template/Oneui/css/oneui.min.css">
    <link rel="stylesheet" href="/static/template/Oneui/css/jquery-confirm.min.css">
</head>
<body>
<div id="page-loader" class="show"></div>
<div id="page-container">
    <main id="main-container">
        <div class="bg-image" style="background-image: url('/static/template/Oneui/image/photo28@2x.jpg');">
            <div class="row no-gutters bg-primary-dark-op">
                <div class="hero-static col-lg-4 d-none d-lg-flex flex-column justify-content-center">
                    <div class="p-4 p-xl-5 flex-grow-1 d-flex align-items-center">
                        <div class="w-100">
                            <a class="link-fx font-w600 font-size-h2 text-white" href="javascript:void(0)">
                                {:config('web.webname')}
                            </a>
                            <p class="text-white-75 mr-xl-8 mt-2" id="hitokoto_text">
                                :ID 获取中...
                            </p>
                            <span class="text-white-75" id="hitokoto_from">:ID 获取中...</span>
                        </div>
                    </div>
                    <div class="p-4 p-xl-5 d-xl-flex justify-content-between align-items-center font-size-sm">
                        <p class="font-w500 text-white-50 mb-0">
                            Copyright &copy; <span data-toggle="year-copy"></span> <strong>{:config('web.webname')}</strong>
                        </p>
                    </div>
                </div>
                <div class="hero-static col-lg-8 d-flex flex-column align-items-center bg-white">
                    <div class="p-3 w-100 d-lg-none text-center">
                        <a class="link-fx font-w600 font-size-h3 text-dark" href="javascript:void(0)">
                            {:config('web.webname')}
                        </a>
                    </div>
                    <div class="p-4 w-100 flex-grow-1 d-flex align-items-center">
                        <div class="w-100">
                            <div class="text-center mb-5">
                                <p class="mb-3">
                                    <i class="fa fa-2x fa-circle-notch text-primary-light"></i>
                                </p>
                                <h1 class="font-w700 mb-2">
                                    找回密码
                                </h1>
                                <h2 class="font-size-base text-muted">
                                    「 <span id="jinrishici-sentence"></span>」
                                </h2>
                            </div>
                            <div class="row no-gutters justify-content-center">
                                <div class="col-sm-8 col-xl-4">
                                    <form class="js-validation-signin" onsubmit="return false;">
                                        <div class="form-group">
                                            <input type="text" placeholder="输入你的邮箱" class="form-control form-control-lg form-control-alt py-4" id="mail" name="mail" />
                                            <div class="text-center" style="margin-top: 20px;">
                                                <span class="text-muted">
                                                    邮箱默认为您的QQ账号邮箱
                                                </span>
                                            </div>
                                        </div>
                                        <div class="form-group form-row">
                                            <div class="col-7">
                                                <input type="text" id="captcha" name="captcha" class="form-control form-control-lg form-control-alt py-4" placeholder="请输入验证码">
                                            </div>
                                            <div class="col-5">
                                                <img id="captcha_img" src="{:captcha_src()}" height="100%" width="100%" class="pull-right code" style="cursor: pointer;" onclick='this.src="{:captcha_src()}?"+Math.random();' title="点击刷新" alt="captcha">
                                            </div>
                                        </div>
                                        <div class="form-group d-flex justify-content-between align-items-center">
                                            <div class="py-2">
                                                <a class="font-size font-w500" href="{:url('login')}">
                                                    <strong>返回登录</strong>
                                                </a>
                                            </div>
                                            <div>
                                                <button type="submit" onclick="ajax_user_find();" class="btn btn-lg btn-alt-primary">
                                                    <i class="fa fa-fw fa-sign-in-alt mr-1 opacity-50"></i> 发送邮件
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <div class="px-4 py-3 w-100 d-lg-none d-flex flex-column flex-sm-row justify-content-between font-size-sm text-center text-sm-left">
                                <p class="font-w500 text-black-50 py-2 mb-0">
                                    Copyright &copy; <span data-toggle="year-copy"></span> <strong>{:config('web.webname')}</strong>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/static/template/Oneui/js/oneui.core.min.js"></script>
<script src="/static/template/Oneui/js/oneui.app.min.js"></script>
<script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>
<script src="/static/js/codebase.app.min-5.0.js"></script>
<script src="/static/js/lib/jquery.min.js"></script>
<script src="/static/js/plugins/jquery-validation/jquery.validate.min.js"></script>
<script src="/static/js/plugins/bootstrap-notify/bootstrap-notify.min.js"></script>
<script src="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-0-M/nprogress/0.2.0/nprogress.min.js"></script>
<script src="/static/js/app.min.js"></script>
<script src="/static/js/layer.js"></script>
<script>
    function ajax_user_find() {
        x.ajax('/index/LoginAjax/find', {
            mail: x.getval('#mail'),
            captcha: x.getval('#captcha')
        }, function (data) {
            if (data.code == 1) {
                x.notify(data.message, 'success');
            } else {
                $('#captcha').val(null);
                $('#captcha_img').click();
                x.notify(data.message, 'warning');
            }
        });
    }
</script>
<script>
    fetch('https://v1.hitokoto.cn')
      .then(response => response.json())
      .then(data => {
        const text = document.getElementById('hitokoto_text')
        text.innerText = data.hitokoto
        const from = document.getElementById('hitokoto_from')
        var author = !!data.from ? data.from : "无名氏";
        from.innerText = "—— " + (data.from_who || '') + "「" + author + "」"
      })
      .catch(console.error)
</script>
</body>
</html>
