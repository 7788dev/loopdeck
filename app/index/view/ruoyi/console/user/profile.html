{extend name="common/layout"/}
{block name="head"} {include file="console/head" /}{/block}
{block name="main"}
<div class="wrapper wrapper-content animated fadeInUp">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>
                        <i class="fa fa-user-circle text-muted"></i> 个人资料
                    </h5>
                </div>
                <div class="ibox-content">
                    <form id="edit-profile" onsubmit="return false;">
                        <div class="row">
                            <div class="col-lg-3">
                                <p class="text-muted">
                                    你可以在这里修改你的用户信息
                                </p>
                            </div>
                            <div class="col-lg-7 col-lg-offset-1">
                                <div class="form-group">
                                    <label class="control-label" for="username">用户名</label>
                                    <input class="form-control input-lg" id="username" name="username"
                                           placeholder="用户名（不可修改）" readonly=""
                                           type="text" value="{:html_escape(session('user.username'))}">
                                </div>
                                <div class="form-group">
                                    <label class="control-label" for="nickname">昵称</label>
                                    <input class="form-control input-lg" id="nickname" name="nickname"
                                           placeholder="输入你的昵称" type="text"
                                           value="{:html_escape(session('user.nickname'))}">
                                </div>
                                <div class="form-group">
                                    <label class="control-label" for="qq">QQ</label>
                                    <input class="form-control input-lg" id="qq" name="qq"
                                           placeholder="输入你的 QQ 号" type="number"
                                           value="{:html_escape(session('user.qq'))}">
                                </div>
                                <div class="form-group">
                                    <label class="control-label" for="mail">邮箱</label>
                                    <input class="form-control input-lg" id="mail" name="mail"
                                           placeholder="输入你的邮箱" type="email"
                                           value="{:html_escape(session('user.mail'))}">
                                </div>
                                <div class="form-group">
                                    <button class="btn btn-primary" onclick="ajax_edit_profile();" type="submit">
                                        更新
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            {include file="console/user/notification" /}

            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>
                        <i class="fa fa-asterisk text-muted"></i> 修改密码
                    </h5>
                </div>
                <div class="ibox-content">
                    <form id="change_PassWord" onsubmit="return false;">
                        <div class="row">
                            <div class="col-lg-3">
                                <p class="text-muted">
                                    你可以在这里修改登录密码
                                </p>
                            </div>
                            <div class="col-lg-7 col-lg-offset-1">
                                <div class="form-group">
                                    <label class="control-label" for="outpass">当前密码</label>
                                    <input class="form-control input-lg" id="outpass" name="outpass"
                                           type="password" autocomplete="current-password">
                                </div>
                                <div class="form-group">
                                    <label class="control-label" for="password">新密码</label>
                                    <input class="form-control input-lg" id="password" name="password"
                                           type="password" autocomplete="new-password">
                                </div>
                                <div class="form-group">
                                    <label class="control-label" for="repass">确认新密码</label>
                                    <input class="form-control input-lg" id="repass" name="repass"
                                           type="password" autocomplete="new-password">
                                </div>
                                <div class="form-group">
                                    <button class="btn btn-primary" onclick="ajax_change_PassWord();" type="submit">
                                        修改
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="foot"}
<script src="/static/js/notification-settings.js?v={:app_version()}"></script>
<script>
    function ajax_edit_profile() {
        var nickname = x.getval('#nickname', '请先输入昵称！');
        if (!nickname) return;
        var qq = x.getval('#qq', '请先输入QQ！');
        if (!qq) return;
        var mail = x.getval('#mail', '请先输入邮箱！');
        if (!mail) return;
        x.ajax('/index/ajax/user/profile', {
            nickname: nickname,
            qq: qq,
            mail:mail,
        }, function (data) {
            if (data.code == 1) {
                x.notify(data.message, 'success');
            } else {
                x.notify(data.message, 'warning');
            }
        })
    }

    function ajax_change_PassWord() {
        var outpass = x.getval('#outpass', '请输入当前密码！');
        if (!outpass) return;
        var password = x.getval('#password', '请设置新的登录密码！');
        if (!password) return;
        var repass = x.getval('#repass', '请再输入一次新密码！');
        if (!repass) return;
        if (password != repass) {
            x.notify("两次输入的新密码不一致！", 'warning');
            return false;
        }
        x.ajax('/index/ajax/user/passWord', {
            outpass: outpass,
            password: password,
            repass: repass,
        }, function (data) {
            if (data.code == 1) {
                x.notify(data.message, 'success');
            } else {
                x.notify(data.message, 'warning');
            }
        })
    }

</script>
{/block}
