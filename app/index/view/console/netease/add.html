{extend name="common/layout"/}
{block name="head"} {include file="console/head" /}{/block}
{block name="main"}
<div class="wrapper wrapper-content animated fadeInUp">
    <div class="row">
        <div class="col-md-6">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>账号密码添加（请使用网易云音乐账号登录） <span class="label label-warning">维护中</span></h5>
                </div>
                <div class="ibox-content">
                    <div class="alert alert-warning" role="alert">
                        <i class="fa fa-wrench"></i>
                        <p style="margin: 0;">账号密码登录功能维护中，暂时无法使用，请先通过右侧扫码添加账号。</p>
                    </div>
                    <form onsubmit="return false;" id="login-form">
                        <div class="form-group">
                            <label class="control-label" for="login-username">手机号</label>
                            <div class="input-group">
                                <span class="input-group-addon">
                                  <i class="fa fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="login-username" name="login-username" placeholder="请输入手机号" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label" for="login-password">密码</label>
                            <div class="input-group">
                                <span class="input-group-addon">
                                  <i class="fa fa-key"></i>
                                </span>
                                <input type="password" class="form-control" id="login-password" name="login-password" placeholder="请输入密码" disabled>
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-primary" onclick="ajax_netease_login();" disabled>
                                <i class="fa fa-arrow-right"></i> 登录
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>扫码添加</h5>
                </div>
                <div class="ibox-content text-center">
                    <div class="alert alert-info" role="alert">
                        <i class="fa fa-magic"></i>
                        <p style="margin: 0;" id="qr-alert" aria-live="polite">点击图片即可获取二维码</p>
                    </div>
                    <div id="qr-img" class="ld-qr-box" role="button" tabindex="0" aria-label="点击获取网易云音乐登录二维码" title="点击获取登录二维码" key="">
                        <p style="margin-top: 15px;">
                            <i class="fa fa-camera fa-4x text-muted"></i>
                        </p>
                    </div>
                    <div class="m-t-md">
                        <button type="button" class="btn btn-primary" onclick="ajax_netease_qrlogin();"><i class="fa fa-check"></i> 扫码完成，点击验证</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="foot"}
<script>
    // 账号密码登录维护中：表单组件保留但已禁用，不再提交任何凭证，后端接口同样只返回维护提示。
    function ajax_netease_login()
    {
        x.notify('账号密码登录维护中，请使用扫码添加账号', 'warning');
    }

    (function () {
        // PJAX may execute this script again before an old callback returns.
        if (typeof window.loopdeckNeteaseLoginCleanup === 'function') {
            window.loopdeckNeteaseLoginCleanup();
        }
        var $qrImg = $('#qr-img');
        var $qrAlert = $('#qr-alert');
        var disposed = false;
        var qr_load_pending = false;
        var login_attempt = null;
        var verification = null;
        var redirect_timer = null;

        function active() {
            return !disposed && $qrImg.length > 0 && document.body.contains($qrImg[0]);
        }

        function stopVerification() {
            if (verification) verification.stop();
        }

        function cleanup() {
            disposed = true;
            login_attempt = null;
            stopVerification();
            clearTimeout(redirect_timer);
            if (window.loopdeckNeteaseLoginCleanup === cleanup) {
                window.loopdeckNeteaseLoginCleanup = null;
                $(document).off('pjax:beforeReplace.loopdeck-netease-login');
            }
            if (window.ajax_netease_qrlogin === ajax_netease_qrlogin) {
                delete window.ajax_netease_qrlogin;
            }
        }

        window.loopdeckNeteaseLoginCleanup = cleanup;
        $(document).off('pjax:beforeReplace.loopdeck-netease-login')
            .on('pjax:beforeReplace.loopdeck-netease-login', cleanup);

        function redirectToAccounts() {
            clearTimeout(redirect_timer);
            redirect_timer = setTimeout(function () {
                if (active()) window.location.href = "{:url(\"/index/console/netease/list\")}";
            }, 1000);
        }

        function load_qr() {
            if (!active() || qr_load_pending) return;
            stopVerification();
            login_attempt = null;
            clearTimeout(redirect_timer);
            qr_load_pending = true;
            $qrImg.attr('key', '').addClass('ld-qr-loading').html('<p style="margin-top: 15px;"><i class="fa fa-spinner fa-spin fa-4x text-muted"></i></p>');
            $qrAlert.text('正在获取二维码');
            x.ajax('/index/ajax/netease/getQrimg', null, function (data) {
                qr_load_pending = false;
                if (!active()) return;
                $qrImg.removeClass('ld-qr-loading');
                if (data.code == 1) {
                    $qrImg.attr('key', data.data.key).html('<img src="data:image/png;base64,' + x.escapeHtml(data.data.qrimg) + '" height="145px;" alt="网易云音乐登录二维码">');
                    $qrAlert.text('请使用网易云音乐 APP 扫码，完成后点击验证');
                    return;
                }
                $qrImg.html('<p style="margin-top: 15px;"><i class="fa fa-camera fa-4x text-muted"></i></p>');
                $qrAlert.text(data.message || '二维码获取失败，点击图片重试');
            }, function () {
                qr_load_pending = false;
                if (!active()) return;
                $qrImg.removeClass('ld-qr-loading').html('<p style="margin-top: 15px;"><i class="fa fa-camera fa-4x text-muted"></i></p>');
                $qrAlert.text('二维码获取失败，点击图片重试');
            });
        }

        $qrImg.on('click', load_qr).on('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                load_qr();
            }
        });

        function ajax_netease_qrlogin() {
            if (!active() || login_attempt) return;
            var key = $qrImg.attr('key');
            if (!key) return x.notify('请先获取二维码');
            var attempt = {};
            login_attempt = attempt;
            x.ajax('/index/ajax/netease/qrLogin', {key: key}, function (data) {
                if (login_attempt !== attempt) return;
                login_attempt = null;
                if (!active() || $qrImg.attr('key') !== key) return;
                if (data.code == 1) {
                    stopVerification();
                    x.notify(data.message, 'success');
                    redirectToAccounts();
                } else if (data.code == 8810) {
                    start_verify_poll(data.data);
                } else if (data.code == 800) {
                    load_qr();
                } else {
                    x.notify(data.message, 'warning');
                    $qrAlert.text(data.message);
                }
            }, function () {
                if (login_attempt !== attempt) return;
                login_attempt = null;
                if (active()) x.notify('验证失败，请稍后重试', 'warning');
            });
        }
        window.ajax_netease_qrlogin = ajax_netease_qrlogin;

        // Each verification owns its timeout/request; responses schedule the
        // next poll so a slow upstream never creates overlapping requests.
        function start_verify_poll(d) {
            if (!d || !d.verify_unikey) {
                x.notify('安全验证信息缺失，请重试', 'warning');
                return;
            }
            stopVerification();
            var run = {timer: null, request: null, stopped: false};
            verification = run;
            function current() {
                return !run.stopped && verification === run && active();
            }
            run.stop = function () {
                if (run.stopped) return;
                run.stopped = true;
                clearTimeout(run.timer);
                if (run.request) run.request.abort();
                run.request = null;
                if (verification === run) verification = null;
            };
            function schedule(delay) {
                if (current()) run.timer = setTimeout(poll, delay);
            }
            function poll() {
                run.timer = null;
                if (!current()) {
                    run.stop();
                    return;
                }
                run.request = x.ajax('/index/ajax/netease/verifyCheck', {verify_unikey: d.verify_unikey}, function (data) {
                    run.request = null;
                    if (!current()) return;
                    if (data.code == 1) {
                        run.stop();
                        x.notify(data.message, 'success');
                        redirectToAccounts();
                    } else if (data.code == 800) {
                        run.stop();
                        x.notify('验证二维码已过期，请重新获取', 'warning');
                    } else {
                        $qrAlert.text(data.message);
                        schedule(2000);
                    }
                }, function () {
                    run.request = null;
                    if (!current()) return;
                    $qrAlert.text('验证状态获取失败，正在重试');
                    schedule(2000);
                }, false);
            }
            $qrImg.attr('key', '');
            $qrAlert.html('当前网络环境存在风险，请用<strong>已登录该账号</strong>的网易云音乐APP扫描下方验证二维码');
            if (d.verify_qrimg) {
                $qrImg.html('<img src="data:image/png;base64,' + x.escapeHtml(d.verify_qrimg) + '" height="145px;" alt="网易云音乐安全验证二维码">');
            }
            schedule(1500);
        }
    })();

</script>
{/block}
