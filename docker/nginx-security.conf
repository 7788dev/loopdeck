# Preserve the original route for ThinkPHP's multi-application dispatcher.
location = /index.php {
    set $loopdeck_path_info /;
    if ($request_uri ~ "^([^?]+)") {
        set $loopdeck_path_info $1;
    }

    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $loopdeck_path_info;
    fastcgi_read_timeout 300;
}

# Uploaded files are static data and must never reach PHP-FPM.
location ^~ /static/uploads/temp/ {
    return 404;
}

location ^~ /static/uploads/ {
    if ($uri ~* "\.(?:php[0-9]?|phtml|pht|phar|cgi|pl|py|sh|asp|aspx|jsp|shtml)$") {
        return 404;
    }

    try_files $uri =404;
}
