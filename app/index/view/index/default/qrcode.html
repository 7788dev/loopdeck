<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>向 {$name} 付款</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f3f5f7; color: #243244; font-family: sans-serif; }
    main { max-width: 420px; margin: 24px auto; padding: 28px 20px; border-radius: 16px; background: #fff; text-align: center; }
    h1 { font-size: 22px; overflow-wrap: anywhere; }
    img { display: block; width: 100%; max-width: 280px; margin: 24px auto; }
    p { line-height: 1.8; color: #58677a; }
  </style>
</head>
<body>
<main>
  <h1>向 {$name} 付款</h1>
  <p>{if condition="$type eq 'wechat'"}微信收款码{else /}QQ 收款码{/if}</p>
  <img src="/index/index/createQrcode?text={:rawurlencode($url)}" alt="收款二维码">
  <p>长按识别二维码后付款<br>付款前请核对收款人和金额</p>
</main>
</body>
</html>
