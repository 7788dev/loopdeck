{extend name="common/layout"/}
{block name="head"} {include file="console/head" /}{/block}
{block name="main"}
<div class="row">
    <div class="col-md-8">
        <div class="block block-rounded">
            <div class="block-header block-header-default">
                <h3 class="block-title">导入百度贴吧登录 Cookie</h3>
            </div>
            <div class="block-content">
                <div class="alert alert-info">
                    为避免账号密码经过服务器，当前仅支持 Cookie 导入。至少需要包含 <code>BDUSS</code>；凭据只保存在本机数据库。
                </div>
                <form onsubmit="return false;">
                    <div class="mb-4">
                        <label class="form-label" for="tieba-cookie">Cookie</label>
                        <textarea class="form-control" id="tieba-cookie" rows="5" autocomplete="off"
                                  placeholder="BDUSS=...; STOKEN=..."></textarea>
                    </div>
                    <div class="mb-4">
                        <button type="button" class="btn btn-alt-primary" onclick="addTiebaAccount();">
                            <i class="fa fa-check opacity-50 me-1"></i> 验证并保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{/block}
{block name="foot"}
<script>
function addTiebaAccount() {
    const cookie = x.getval('#tieba-cookie', '请先输入 Cookie');
    if (!cookie) return;
    x.ajax('/index/ajax/tieba/add', {cookie: cookie}, function (data) {
        x.notify(data.message, data.code === 1 ? 'success' : 'warning');
        if (data.code === 1) {
            setTimeout(function () {
                window.location.href = '{:url("/index/console/tieba/list")}';
            }, 800);
        }
    });
}
</script>
{/block}
