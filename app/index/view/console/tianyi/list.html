{extend name="common/layout"/}
{block name="head"}{include file="console/head" /}{/block}
{block name="main"}
<div class="row">
    <div class="col-12">
        <div class="block block-rounded bg-gd-aqua checkin-hero">
            <i class="fa fa-cloud checkin-hero-mark" aria-hidden="true"></i>
            <div class="block-content block-content-full d-flex flex-wrap align-items-center justify-content-between">
                <div class="me-3">
                    <h3 class="h5 fw-bold text-white mb-1">全部账号列表 - 天翼云盘</h3>
                    <p class="fs-sm text-white-75 mb-0">共 {$total} 个账号 · 每日签到领空间，会话自动续期</p>
                </div>
                <a class="btn btn-sm btn-light mt-2 mt-sm-0" href="/index/console/tianyi/add" data-pjax><i class="fa fa-plus me-1"></i>添加账号</a>
            </div>
        </div>
    </div>
    {include file="console/common/checkin_list" /}
</div>
{/block}
{block name="foot"}
<script src="/static/js/checkin_console.js?v={:app_version()}"></script>
{/block}
