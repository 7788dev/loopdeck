<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>向 {$name} 付款</title>
  <link href="/static/ruoyi/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/ruoyi/css/font-awesome.min.css" rel="stylesheet">
  <style>
    body { background: #f3f3f4; padding: 24px 16px; color: #243244; }
    main { max-width: 420px; margin: 24px auto; background: #fff; text-align: center; }
    main h1 { font-size: 22px; overflow-wrap: anywhere; margin-top: 0; }
    main img { display: block; width: 100%; max-width: 280px; margin: 24px auto; }
    main p { line-height: 1.8; color: #58677a; }
  </style>
</head>
<body>
<main class="ibox float-e-margins">
  <div class="ibox-title">
    <h5><i class="fa fa-qrcode"></i> 收款码</h5>
  </div>
  <div class="ibox-content">
    <h1>向 {$name} 付款</h1>
    <p>{if condition="$type eq 'wechat'"}微信收款码{else /}QQ 收款码{/if}</p>
    <img src="/index/index/createQrcode?text={:rawurlencode($url)}" alt="收款二维码">
    <p>长按识别二维码后付款<br>付款前请核对收款人和金额</p>
  </div>
</main>
</body>
</html>
